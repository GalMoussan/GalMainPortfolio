<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<base href="/onepiece/">
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Drop Merge">
		<title>Drop Merge</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	height: 100%;
	width: 100%;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1b1016;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#hs-form {
	position: fixed;
	display: none;
	flex-direction: row;
	align-items: stretch;
	gap: 8px;
	margin: 0;
	padding: 0;
	z-index: 20;
	box-sizing: border-box;
	touch-action: manipulation;
}

#hs-input {
	flex: 1 1 auto;
	min-width: 0;
	background-color: rgba(31, 15, 20, 0.96);
	border: 2px solid #e0b088;
	border-radius: 12px;
	color: #fff4e4;
	font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
	font-size: 16px;
	font-weight: 600;
	padding: 0 12px;
	outline: none;
	box-sizing: border-box;
	-webkit-appearance: none;
	appearance: none;
	touch-action: manipulation;
}

#hs-input::placeholder {
	color: rgba(255, 244, 228, 0.45);
}

#hs-input:focus {
	border-color: #ffd36a;
	box-shadow: 0 0 0 2px rgba(255, 211, 106, 0.28);
}

#hs-save {
	flex: 0 0 auto;
	min-width: 84px;
	background-color: #e25b3a;
	border: none;
	border-radius: 14px;
	color: #fff8ef;
	font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
	font-size: 17px;
	font-weight: 700;
	padding: 0 16px;
	cursor: pointer;
	box-sizing: border-box;
	touch-action: manipulation;
	-webkit-tap-highlight-color: transparent;
}

#hs-save:hover {
	background-color: #ff7652;
}

#hs-save:active {
	background-color: #b84328;
}

		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<form id="hs-form" autocomplete="off">
			<input id="hs-input" type="text" maxlength="16" placeholder="Enter your name" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" />
			<button id="hs-save" type="submit">Save</button>
		</form>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":15666724,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
GODOT_CONFIG.mainPack = 'index.pck';
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
const canvas = document.getElementById('canvas');
['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach((type) => {
	canvas.addEventListener(type, (event) => {
		if (event.cancelable) {
			event.preventDefault();
		}
	}, { passive: false });
});

(function () {
	const STORAGE_KEY = 'onepiece_leaderboard_v1';
	const MAX_ENTRIES = 3;
	const MAX_NAME_LEN = 16;
	const hsForm = document.getElementById('hs-form');
	const hsInput = document.getElementById('hs-input');

	let scores = [];
	let sessionSubmitted = [];
	let pendingSubmittedName = '';
	let formVisible = false;
	let fetchEpoch = 0;

	function sanitizeName(raw) {
		if (typeof raw !== 'string') return '';
		return raw
			.replace(/[\u0000-\u001F\u007F]/g, '')
			.replace(/\s+/g, ' ')
			.trim()
			.slice(0, MAX_NAME_LEN);
	}

	function normalizeScores(list) {
		if (!Array.isArray(list)) return [];
		const valid = [];
		for (let i = 0; i < list.length; i++) {
			const item = list[i];
			if (!item || typeof item !== 'object') continue;
			const name = sanitizeName(item.name);
			const score = Math.floor(Number(item.score));
			if (!name || !Number.isFinite(score) || score <= 0) continue;
			valid.push({ name, score });
		}
		valid.sort((a, b) => b.score - a.score);
		return valid.slice(0, MAX_ENTRIES);
	}

	function mergeScoreLists() {
		const merged = [];
		const counts = new Map();
		for (let i = 0; i < arguments.length; i++) {
			const list = normalizeScores(arguments[i]);
			const localCounts = new Map();
			for (let j = 0; j < list.length; j++) {
				const item = list[j];
				const key = item.name.toLowerCase() + '::' + item.score;
				const nextCount = (localCounts.get(key) || 0) + 1;
				localCounts.set(key, nextCount);
				const existingCount = counts.get(key) || 0;
				if (nextCount > existingCount) {
					counts.set(key, nextCount);
					merged.push(item);
				}
			}
		}
		return normalizeScores(merged);
	}

	function loadStored() {
		try {
			const raw = window.localStorage.getItem(STORAGE_KEY);
			if (!raw) return;
			const parsed = JSON.parse(raw);
			if (Array.isArray(parsed)) {
				scores = normalizeScores(parsed);
			} else if (parsed && Array.isArray(parsed.scores)) {
				scores = normalizeScores(parsed.scores);
			}
		} catch (_) {}
	}

	function saveStored() {
		try {
			window.localStorage.setItem(STORAGE_KEY, JSON.stringify({ scores }));
		} catch (_) {}
	}

	loadStored();

	['keydown', 'keyup', 'keypress', 'mousedown', 'mouseup', 'pointerdown', 'pointerup', 'touchstart', 'touchend', 'click'].forEach((evtName) => {
		hsForm.addEventListener(evtName, (e) => {
			e.stopPropagation();
		});
	});

	hsForm.addEventListener('submit', (e) => {
		e.preventDefault();
		e.stopPropagation();
		const cleaned = sanitizeName(hsInput.value);
		if (!cleaned) {
			hsInput.placeholder = 'Enter your name!';
			hsInput.focus();
			return;
		}
		pendingSubmittedName = cleaned;
		hsInput.blur();
		hsForm.style.display = 'none';
		formVisible = false;
		try {
			canvas.focus();
			canvas.dispatchEvent(new Event('focus'));
			canvas.dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
		} catch (_) {}
	});

	window.onepieceLeaderboard = {
		getScoresJson: function () {
			return JSON.stringify(scores);
		},
		seedScores: function (rawList) {
			scores = mergeScoreLists(scores, rawList, sessionSubmitted);
			saveStored();
			return JSON.stringify(scores);
		},
		fetchRemote: function () {
			const myEpoch = ++fetchEpoch;
			const url = window.location.origin + '/api/onepiece-leaderboard?_t=' + Date.now();
			fetch(url, {
				method: 'GET',
				headers: { 'Accept': 'application/json' },
				cache: 'no-store',
			})
				.then((res) => (res.ok ? res.json() : null))
				.then((data) => {
					if (!data || !Array.isArray(data.scores)) return;
					if (myEpoch !== fetchEpoch) {
						scores = mergeScoreLists(data.scores, scores, sessionSubmitted);
					} else {
						scores = mergeScoreLists(data.scores, sessionSubmitted);
					}
					saveStored();
				})
				.catch(() => {});
		},
		submitScore: function (name, rawScore) {
			const cleaned = sanitizeName(name);
			const numScore = Math.floor(Number(rawScore));
			if (!cleaned || !Number.isFinite(numScore) || numScore <= 0) {
				return JSON.stringify(scores);
			}
			const previousScores = scores.slice();
			const entry = { name: cleaned, score: numScore };
			sessionSubmitted = normalizeScores(sessionSubmitted.concat([entry]));
			scores = normalizeScores(scores.concat([entry]));
			saveStored();
			fetchEpoch++;
			const url = window.location.origin + '/api/onepiece-leaderboard?_t=' + Date.now();
			fetch(url, {
				method: 'POST',
				keepalive: true,
				headers: {
					'Content-Type': 'application/json',
					'Accept': 'application/json',
				},
				body: JSON.stringify({
					name: cleaned,
					score: numScore,
					previousScores: previousScores,
				}),
				cache: 'no-store',
			})
				.then((res) => (res.ok ? res.json() : null))
				.then((data) => {
					if (!data || !Array.isArray(data.scores)) return;
					scores = mergeScoreLists(data.scores, sessionSubmitted);
					saveStored();
				})
				.catch(() => {});
			return JSON.stringify(scores);
		},
		syncForm: function (visible, x, y, w, h, vw, vh) {
			if (!visible || vw <= 0 || vh <= 0) {
				if (formVisible) {
					hsForm.style.display = 'none';
					formVisible = false;
					try {
						canvas.focus();
						canvas.dispatchEvent(new Event('focus'));
						canvas.dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
					} catch (_) {}
				}
				return;
			}
			const rect = canvas.getBoundingClientRect();
			const left = rect.left + (x / vw) * rect.width;
			const top = rect.top + (y / vh) * rect.height;
			const width = (w / vw) * rect.width;
			const height = Math.max(38, (h / vh) * rect.height);
			hsForm.style.left = Math.round(left) + 'px';
			hsForm.style.top = Math.round(top) + 'px';
			hsForm.style.width = Math.round(width) + 'px';
			hsForm.style.height = Math.round(height) + 'px';
			if (!formVisible) {
				formVisible = true;
				hsInput.value = '';
				hsInput.placeholder = 'Enter your name';
				hsForm.style.display = 'flex';
				setTimeout(() => {
					if (formVisible) {
						try { hsInput.focus(); } catch (_) {}
					}
				}, 30);
			}
		},
		consumeSubmittedName: function () {
			const val = pendingSubmittedName;
			pendingSubmittedName = '';
			return val;
		},
	};
	window.onepieceLeaderboard.fetchRemote();
}());

if ('serviceWorker' in navigator) {
	navigator.serviceWorker.getRegistration().then((reg) => {
		if (!reg) return;
		reg.update();
		if (reg.waiting) {
			reg.waiting.postMessage('update');
		}
		reg.addEventListener('updatefound', () => {
			const nextWorker = reg.installing;
			if (!nextWorker) return;
			nextWorker.addEventListener('statechange', () => {
				if (nextWorker.state === 'installed' && navigator.serviceWorker.controller) {
					nextWorker.postMessage('update');
				}
			});
		});
	}).catch(() => {});
}

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
